<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>

  <!--========= LINKS HOJAS DE ESTILO =========-->
  <link rel="stylesheet" href="./Public/Style/General.css">
  <link rel="stylesheet" href="./Public/Style/Index.css">
</head>
<body>
  <div class="register-container">

    <h1 class="register-title">Crear cuenta</h1>

    <form id="registerForm" class="register-form">

      <label>Nombre</label>
      <input type="text" id="nombre_usuario" required>

      <label>Apellidos</label>
      <input type="text" id="apellidos" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Contraseña</label>
      <input type="password" id="password" required>

      <label>Confirmar contraseña</label>
      <input type="password" id="password_confirmation" required>

      <button type="submit" class="btn">Registrarse</button>

    </form>

    <p class="register-login">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </p>
  </div>

  <!--========= SCRIPTS =========-->
  <script src="./Public/js/axios.min.js"></script>
  <script src="./Public/js/clienteAxios.js"></script>
  <script src="./Public/js/register.js"></script>

</body>
</html>
